<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape the Locker Room</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#12312A; --board-2:#0E2721;
    --chalk:#ECEFE4; --chalk-dim:rgba(236,239,228,0.55);
    --chalk-line:rgba(236,239,228,0.18);
    --yellow:#F2C14E; --red:#E5624C; --green:#7FC29B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;
    background:radial-gradient(120% 80% at 50% -10%, rgba(242,193,78,0.06), transparent 60%),
      linear-gradient(180deg,var(--board),var(--board-2));
    color:var(--chalk);font-family:'Inter',sans-serif;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.45;
    background-image:linear-gradient(var(--chalk-line) 1px,transparent 1px),
      radial-gradient(circle at 50% 46%, transparent 118px, var(--chalk-line) 119px, transparent 121px);
    background-size:100% 100%,100% 100%;background-position:center;background-repeat:no-repeat;
    border-left:1px solid var(--chalk-line);}

  .hud{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;
    align-items:center;padding:14px 26px;}
  .hud .brand{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.26em;
    text-transform:uppercase;font-size:14px;color:var(--chalk-dim);}
  .hud .meters{display:flex;gap:12px;}
  .meter{border:1px solid var(--chalk-line);border-radius:8px;padding:6px 16px;
    background:rgba(0,0,0,.24);text-align:center;min-width:118px;}
  .meter .lbl{font-family:'Oswald',sans-serif;letter-spacing:.16em;text-transform:uppercase;
    font-size:10px;color:var(--chalk-dim);margin-bottom:2px;}
  .meter .val{font-family:'Oswald',sans-serif;font-weight:700;font-size:32px;line-height:1;}
  #clock.warn{color:var(--red);animation:blink 1s steps(1) infinite;}
  #clock.amber{color:var(--yellow);}
  #score .val{color:var(--yellow);}
  #bonus .val{color:var(--yellow);}
  #bonus.expired{opacity:.4;}
  #bonus.expired .val{color:var(--chalk-dim);}
  @keyframes blink{50%{opacity:.4;}}

  /* progress pips */
  #progress{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:14px;}
  #progress.hidden{display:none;}
  .pip{font-family:'Oswald',sans-serif;letter-spacing:.12em;text-transform:uppercase;font-size:12px;
    color:var(--chalk-dim);border:1px solid var(--chalk-line);border-radius:100px;padding:4px 14px;}
  .pip.active{color:var(--board);background:var(--yellow);border-color:var(--yellow);}
  .pip.done{color:var(--green);border-color:var(--green);}

  .stage{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;
    justify-content:center;padding:112px 72px 132px;}

  .lock-tag{display:inline-flex;align-self:flex-start;font-family:'Oswald',sans-serif;letter-spacing:.2em;
    text-transform:uppercase;font-size:13px;color:var(--board);background:var(--yellow);
    padding:6px 14px;border-radius:100px;margin-bottom:16px;font-weight:600;}
  .lock-tag.dim{background:transparent;color:var(--chalk-dim);border:1px solid var(--chalk-line);}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:58px;margin:0 0 14px;line-height:1.02;}
  h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:38px;margin:0 0 12px;}
  .lede{font-size:20px;line-height:1.55;max-width:900px;color:var(--chalk);}
  .lede.dim{color:var(--chalk-dim);}
  .accent{color:var(--yellow);}
  .digit-note{margin-top:20px;font-family:'Oswald',sans-serif;letter-spacing:.06em;font-size:17px;
    color:var(--yellow);border-top:1px dashed var(--chalk-line);padding-top:12px;display:inline-block;}

  table.grp{border-collapse:collapse;margin:6px 0 4px;font-size:19px;}
  table.grp caption{caption-side:top;text-align:left;font-family:'Oswald',sans-serif;letter-spacing:.1em;
    text-transform:uppercase;font-size:13px;color:var(--chalk-dim);margin-bottom:8px;}
  table.grp th,table.grp td{padding:7px 15px;text-align:center;border-bottom:1px solid var(--chalk-line);}
  table.grp th{font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:.08em;color:var(--chalk-dim);
    font-size:14px;text-transform:uppercase;}
  table.grp td.team{text-align:left;font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;}
  .results{list-style:none;padding:0;margin:10px 0 0;font-family:'JetBrains Mono',monospace;font-size:20px;}
  .results li{padding:3px 0;}
  .results .hidden-m{color:var(--yellow);}
  .two-col{display:flex;gap:52px;align-items:flex-start;flex-wrap:wrap;}
  .cipher-box{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:48px;letter-spacing:.14em;
    background:rgba(0,0,0,.28);border:1px solid var(--chalk-line);border-radius:12px;padding:20px 30px;
    margin:8px 0 12px;color:var(--yellow);display:inline-block;}
  .alpha{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--chalk-dim);max-width:1040px;
    line-height:2;margin:2px 0;background:rgba(0,0,0,.18);border:1px solid var(--chalk-line);
    border-radius:8px;padding:11px 15px;}
  ol.clues{font-size:20px;line-height:1.65;max-width:820px;padding-left:26px;margin:6px 0 0;}
  ol.clues li{margin-bottom:3px;}
  .grid-hint{margin-top:12px;font-size:15px;color:var(--chalk-dim);font-style:italic;}

  /* polybius grid */
  table.poly{border-collapse:collapse;font-family:'JetBrains Mono',monospace;margin:6px 0;}
  table.poly td,table.poly th{width:54px;height:48px;text-align:center;border:1px solid var(--chalk-line);
    font-size:22px;}
  table.poly th{color:var(--yellow);font-weight:700;background:rgba(242,193,78,.08);}
  .refs{font-family:'JetBrains Mono',monospace;font-size:34px;letter-spacing:.06em;color:var(--yellow);
    background:rgba(0,0,0,.28);border:1px solid var(--chalk-line);border-radius:12px;padding:16px 26px;
    display:inline-block;margin:6px 0 12px;}

  /* controls bar */
  #controls{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;align-items:center;
    justify-content:center;gap:26px;padding:16px 26px;background:linear-gradient(0deg,rgba(0,0,0,.34),transparent);}
  #controls.hidden{display:none;}
  .navgrp{display:flex;align-items:center;gap:10px;color:var(--chalk-dim);
    font-family:'Oswald',sans-serif;letter-spacing:.08em;font-size:14px;}
  .btn{font-family:'Oswald',sans-serif;letter-spacing:.06em;text-transform:uppercase;font-size:15px;
    border:1px solid var(--chalk-line);background:rgba(0,0,0,.25);color:var(--chalk);border-radius:8px;
    padding:10px 16px;cursor:pointer;}
  .btn:hover{border-color:var(--yellow);}
  .btn.primary{background:var(--yellow);color:var(--board);border-color:var(--yellow);font-weight:700;}
  .entrygrp{display:flex;align-items:center;gap:10px;}
  #answer{font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;
    background:rgba(0,0,0,.3);border:2px solid var(--chalk-line);border-radius:10px;color:var(--chalk);
    padding:10px 16px;width:280px;text-align:center;outline:none;}
  #answer:focus{border-color:var(--yellow);}
  #answer.shake{animation:shake .4s;border-color:var(--red);}
  @keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-9px);}40%,80%{transform:translateX(9px);}}
  #feedback{font-family:'Oswald',sans-serif;letter-spacing:.06em;font-size:15px;min-width:150px;}
  #feedback.ok{color:var(--green);} #feedback.no{color:var(--red);}

  /* toast */
  #toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:20;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:46px;color:var(--green);
    background:rgba(10,25,20,.92);border:2px solid var(--green);border-radius:16px;padding:26px 46px;
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;text-align:center;}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

  .center{align-items:center;text-align:center;}
  .start-hint{margin-top:26px;color:var(--chalk-dim);font-size:16px;}
  .big-num{font-family:'Oswald',sans-serif;font-weight:700;font-size:96px;color:var(--yellow);line-height:1;margin:10px 0;}
  kbd{font-family:'JetBrains Mono',monospace;background:rgba(0,0,0,.3);border:1px solid var(--chalk-line);
    border-radius:4px;padding:1px 6px;font-size:12px;}
.icon-row{display:flex;gap:34px;align-items:center;margin:26px 0 8px;}
  .eq-icon{width:96px;height:96px;border-radius:14px;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.4);}
.keypad{display:grid;grid-template-columns:repeat(3,96px);gap:12px;margin:20px 0 6px;}
  .key{position:relative;width:96px;height:96px;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.4);}
  .key img{width:100%;height:100%;object-fit:cover;display:block;}
  .key .kd{position:absolute;top:5px;left:7px;font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;color:var(--board);background:var(--yellow);border-radius:6px;padding:0 6px;}
  .key.start{outline:3px solid var(--yellow);outline-offset:1px;}
  .key .stag{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:.12em;background:var(--yellow);color:var(--board);padding:1px 7px;border-radius:100px;font-weight:700;}
.key{cursor:pointer;}
  .key:active{transform:scale(.95);}
.seqwrap{display:flex;align-items:center;gap:14px;margin:14px 0 4px;}
  #seqstrip{display:flex;gap:8px;min-height:46px;align-items:center;}
  .seqimg{width:46px;height:46px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.4);}
</style>
</head>
<body>
<div class="hud">
  <div class="brand">Escape the Locker Room</div>
  <div class="meters">
    <div class="meter" id="score"><div class="lbl">Score</div><div class="val" id="scoreVal">0</div></div>
    <div class="meter" id="bonus"><div class="lbl">Speed bonus</div><div class="val" id="bonusVal">+5</div></div>
    <div class="meter"><div class="lbl">Time remaining</div><div class="val" id="clock">10:00</div></div>
  </div>
</div>

<div id="progress" class="hidden">
  <div class="pip" data-p="0">1 · Lockers</div>
  <div class="pip" data-p="1">2 · Tactics</div>
  <div class="pip" data-p="2">3 · Exit</div>
</div>

<div class="stage" id="stage"></div>

<div id="controls" class="hidden">
  <div class="navgrp">
    <button class="btn" id="prevBtn">&larr;</button>
    <span id="panelLabel">Clue 1 / 1</span>
    <button class="btn" id="nextBtn">&rarr;</button>
  </div>
  <div class="entrygrp">
    <input id="answer" autocomplete="off" spellcheck="false" placeholder="ENTER ANSWER">
    <button class="btn primary" id="submitBtn">Unlock</button>
    <span id="feedback"></span>
  </div>
</div>

<div id="toast"></div>

<script>
function H(s){s=(s||'').toUpperCase().replace(/\s+/g,'');let h=5381;for(let i=0;i<s.length;i++){h=((h*33)^s.charCodeAt(i))>>>0;}return h;}
const A1=2085945164, A2=2739104967, A3=3862942855;

const phases = [
 { tag:'Phase 1 &middot; The Kit Lockers', hint:'ENTER 4-DIGIT CODE', hash:A1, panels:[
   `<span class="lock-tag">Lock 1 &middot; Deduction</span>
    <h2>The Missing Result</h2>
    <p class="lede dim" style="margin-bottom:16px;">The <b>final</b> group table and every result &mdash; except one.
    Reconstruct the <span class="accent">SPAIN v KENYA</span> scoreline.</p>
    <div class="two-col">
      <table class="grp"><caption>Group C &mdash; Final Standings</caption>
        <tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>Pts</th></tr>
        <tr><td class="team">Brazil</td><td>3</td><td>3</td><td>0</td><td>0</td><td>6</td><td>1</td><td>9</td></tr>
        <tr><td class="team">Japan</td><td>3</td><td>1</td><td>1</td><td>1</td><td>4</td><td>5</td><td>4</td></tr>
        <tr><td class="team">Spain</td><td>3</td><td>1</td><td>1</td><td>1</td><td>5</td><td>5</td><td>4</td></tr>
        <tr><td class="team">Kenya</td><td>3</td><td>0</td><td>0</td><td>3</td><td>1</td><td>5</td><td>0</td></tr>
      </table>
      <ul class="results">
        <li>Brazil 3 &ndash; 1 Japan</li><li>Brazil 2 &ndash; 0 Spain</li><li>Brazil 1 &ndash; 0 Kenya</li>
        <li>Japan 2 &ndash; 2 Spain</li><li>Japan 1 &ndash; 0 Kenya</li>
        <li class="hidden-m">Spain ? &ndash; ? Kenya</li>
      </ul>
    </div>
    <div class="digit-note">1st digit = goals SPAIN scored in the missing match.</div>`,

   `<span class="lock-tag">Lock 2 &middot; Cipher</span>
    <h2>The Shifted Message</h2>
    <p class="lede dim" style="margin-bottom:10px;">Each letter was shifted <b>11 forward</b> (11 = a full team on the pitch).
    Shift every letter <b>11 back</b> to read it &mdash; wrap A&rarr;Z. The whole line spells a short sum.</p>
    <div class="cipher-box">EHZ&nbsp;&nbsp;AWFD&nbsp;&nbsp;QZFC</div>
    <div class="alpha">A&middot;1&nbsp;&nbsp;B&middot;2&nbsp;&nbsp;C&middot;3&nbsp;&nbsp;D&middot;4&nbsp;&nbsp;E&middot;5&nbsp;&nbsp;F&middot;6&nbsp;&nbsp;G&middot;7&nbsp;&nbsp;H&middot;8&nbsp;&nbsp;I&middot;9&nbsp;&nbsp;J&middot;10&nbsp;&nbsp;K&middot;11&nbsp;&nbsp;L&middot;12&nbsp;&nbsp;M&middot;13&nbsp;&nbsp;N&middot;14&nbsp;&nbsp;O&middot;15&nbsp;&nbsp;P&middot;16&nbsp;&nbsp;Q&middot;17&nbsp;&nbsp;R&middot;18&nbsp;&nbsp;S&middot;19&nbsp;&nbsp;T&middot;20&nbsp;&nbsp;U&middot;21&nbsp;&nbsp;V&middot;22&nbsp;&nbsp;W&middot;23&nbsp;&nbsp;X&middot;24&nbsp;&nbsp;Y&middot;25&nbsp;&nbsp;Z&middot;26</div>
    <p class="grid-hint">Wrap example: G is 7. 7 &minus; 11 = &minus;4, + 26 = 22 &rarr; V.</p>
    <div class="digit-note">2nd digit = the answer to the decoded sum.</div>`,

   `<span class="lock-tag">Lock 3 &middot; Logic</span>
    <h2>The Penalty Shoot-out</h2>
    <p class="lede dim" style="margin-bottom:10px;">Three teammates &mdash; <b>Ana</b>, <b>Beto</b>, <b>Carla</b> &mdash;
    each wore a different number (<b>7, 8, 9</b>) and aimed at a different corner (<b>Left, Centre, Right</b>).</p>
    <ol class="clues">
      <li>Neither Ana nor Carla aimed at the Centre.</li>
      <li>Carla did not aim at the Left corner.</li>
      <li>The Centre shot was taken with the lowest number.</li>
      <li>Carla's number is higher than Ana's.</li>
    </ol>
    <p class="grid-hint">Tip: build a 3&times;3 grid &mdash; player &times; number &times; corner.</p>
    <div class="digit-note">3rd digit = shirt number of the player who aimed RIGHT.</div>`,

   `<span class="lock-tag">Lock 4 &middot; The Mystery Number</span>
    <h2>The Unknown Shirt</h2>
    <p class="lede dim" style="margin-bottom:10px;">A shirt number <b>N</b> (a single digit 0&ndash;9) where all three are true:</p>
    <ol class="clues">
      <li>N is a prime number.</li>
      <li>N is exactly one more than a perfect square.</li>
      <li>N is odd.</li>
    </ol>
    <p class="grid-hint">Only one digit fits all three.</p>
    <div class="digit-note">4th digit = N. &nbsp; Enter all four digits in lock order.</div>`
 ]},

 { tag:'Phase 2 &middot; The Tactics Board', hint:'ENTER 14-DIGIT CODE', hash:A2, panels:[
   `<span class="lock-tag">Phase 2 &middot; The Tactics Board</span>
    <h2>Read the Formation Grid</h2>
    <p class="lede dim" style="margin-bottom:10px;">On the walls are several seven-letter words. Your seven cards each show a 2-digit code &mdash; <b>X then Y</b> (column across the top, row down the side), <b>zero-based</b>. Decode each card to a letter; the seven letters match exactly one wall word. Put the cards in that word&rsquo;s order and read the codes off &mdash; <b>fourteen digits</b>.</p>
    <div class="two-col">
      <table class="poly">
        <tr><th></th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>
        <tr><th>0</th><td>A</td><td>B</td><td>C</td><td>D</td><td>E</td></tr>
        <tr><th>1</th><td>F</td><td>G</td><td>H</td><td>I</td><td>J</td></tr>
        <tr><th>2</th><td>K</td><td>L</td><td>M</td><td>N</td><td>O</td></tr>
        <tr><th>3</th><td>P</td><td>Q</td><td>R</td><td>S</td><td>T</td></tr>
        <tr><th>4</th><td>U</td><td>V</td><td>W</td><td>X</td><td>Y</td></tr>
      </table>
      <div style="max-width:360px;">
        <p class="grid-hint">Example: <b>V</b> sits in column 1, row 4 &rarr; code <b>14</b>.<br><br>Top numbers = X (column). Side numbers = Y (row). Split the decoding across the team.</p>
      </div>
    </div>
    <div class="digit-note">Enter the 14-digit code &mdash; each letter as X-then-Y, in the word order.</div>`
 ]},

 { tag:'Phase 3 &middot; The Exit Door', hint:'ENTER 4-DIGIT EXIT CODE', hash:A3, panels:[
   `<span class="lock-tag">Phase 3 &middot; The Exit Door</span>
    <h2>The Exit Keypad</h2>

/* ---------- state ---------- */
let started=false, escaped=false, timeup=false;
let ph=0, pan=0, solvedCount=0;
const TOTAL=600; let remaining=TOTAL, running=false, ref=null, finishElapsed=null;

const stage=document.getElementById('stage');
const controls=document.getElementById('controls');
const progress=document.getElementById('progress');
const clockEl=document.getElementById('clock');
const scoreEl=document.getElementById('scoreVal');
const bonusEl=document.getElementById('bonusVal');
const bonusMeter=document.getElementById('bonus');
const answerEl=document.getElementById('answer');
const feedbackEl=document.getElementById('feedback');
const panelLabel=document.getElementById('panelLabel');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const submitBtn=document.getElementById('submitBtn');
const toast=document.getElementById('toast');
let seq=[];
function iconTap(name,el){ if(!started||escaped||timeup) return; if(seq.length>=4) return; seq.push(name); answerEl.value=seq.join('').toUpperCase(); var strip=document.getElementById('seqstrip'); if(strip){ var im=document.createElement('img'); im.src=el.querySelector('img').src; im.className='seqimg'; strip.appendChild(im); } }
function clearSeq(){ seq=[]; answerEl.value=''; var strip=document.getElementById('seqstrip'); if(strip) strip.innerHTML=''; }


const PER_ROUND=5, BONUS=5, BONUS_UNDER=300;
function fmt(t){ return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function baseScore(){ return solvedCount*PER_ROUND; }
function totalScore(){ return baseScore() + ((escaped && finishElapsed<BONUS_UNDER)?BONUS:0); }

function paintHud(){
  clockEl.textContent=fmt(remaining);
  clockEl.classList.toggle('warn',remaining<=60);
  clockEl.classList.toggle('amber',remaining>60&&remaining<=120);
  scoreEl.textContent = escaped ? totalScore() : baseScore();
  const elapsed=TOTAL-remaining;
  const avail = escaped ? (finishElapsed<BONUS_UNDER) : (elapsed<BONUS_UNDER && !timeup);
  bonusEl.textContent = avail ? '+5' : '\u2014';
  bonusMeter.classList.toggle('expired', !avail);
}
function tick(){
  remaining=Math.max(0,remaining-1);
  if(remaining===0 && !escaped){ running=false; clearInterval(ref); timeup=true; render(); }
  paintHud();
}
function startClock(){ if(running||started===false)return; running=true; ref=setInterval(tick,1000); }

function updatePips(){
  progress.querySelectorAll('.pip').forEach(el=>{
    const p=+el.dataset.p; el.classList.toggle('active',p===ph); el.classList.toggle('done',p<ph);
  });
}

function render(){
  if(!started){
    progress.classList.add('hidden'); controls.classList.add('hidden');
    stage.className='stage center';
    stage.innerHTML=`<span class="lock-tag dim">Briefing</span>
      <h1>Escape the Locker Room</h1>
      <p class="lede" style="max-width:820px;">Kickoff is in <span class="accent">10 minutes</span> and your squad is locked in.
      Three phases stand between you and the tunnel &mdash; the lockers, the tactics board, and the exit door.
      Crack each one and enter the answer to unlock the next. No football knowledge needed.</p>
      <p class="lede dim" style="max-width:820px;margin-top:14px;"><span class="accent">5 points</span> for each of the three rounds you clear (kept even if the clock beats you),
      plus a <span class="accent">+5 speed bonus</span> for fully escaping in under 5 minutes. Ten minutes on the clock.</p>
      <button class="btn primary" id="startBtn" style="font-size:22px;padding:14px 40px;margin-top:30px;">Start &mdash; Kick Off</button>
      <p class="start-hint">or press <kbd>Space</kbd></p>`;
    document.getElementById('startBtn').onclick=begin;
    paintHud(); return;
  }
  if(escaped){
    progress.classList.add('hidden'); controls.classList.add('hidden');
    stage.className='stage center';
    const bonusEarned = finishElapsed<BONUS_UNDER;
    stage.innerHTML=`<span class="lock-tag">Full Time</span>
      <h1 style="color:var(--green);">You're on the pitch!</h1>
      <p class="lede">Escaped in <span class="accent">${fmt(finishElapsed)}</span></p>
      <div class="big-num">${totalScore()} pts</div>
      <p class="lede dim">3 rounds &times; 5 = 15${bonusEarned?"  +  speed bonus 5":"  ·  no speed bonus (over 5:00)"}</p>
      <p class="lede dim" style="margin-top:6px;">Press <kbd>R</kbd> to reset for the next team.</p>`;
    return;
  }
  if(timeup){
    progress.classList.add('hidden'); controls.classList.add('hidden');
    stage.className='stage center';
    stage.innerHTML=`<span class="lock-tag" style="background:var(--red);">Whistle</span>
      <h1 style="color:var(--red);">Time's up.</h1>
      <p class="lede">Rounds cleared: <span class="accent">${solvedCount}</span> of 3.</p>
      <div class="big-num">${baseScore()} pts</div>
      <p class="lede dim">${solvedCount} &times; 5 = ${baseScore()}. Press <kbd>R</kbd> to reset for the next team.</p>`;
    return;
  }
  // active phase
  progress.classList.remove('hidden'); controls.classList.remove('hidden');
  stage.className='stage';
  const P=phases[ph];
  stage.innerHTML=P.panels[pan];
  const multi=P.panels.length>1;
  prevBtn.style.visibility=multi?'visible':'hidden';
  nextBtn.style.visibility=multi?'visible':'hidden';
  panelLabel.textContent = multi ? ('Lock '+(pan+1)+' / '+P.panels.length) : P.tag.replace(/&middot;/g,'·').replace(/<[^>]+>/g,'');
  answerEl.placeholder=P.hint;
  updatePips();
  paintHud();
  if(ph===phases.length-1){ seq=[]; }
  answerEl.focus();
}

function begin(){ started=true; ph=0; pan=0; render(); startClock(); answerEl.focus(); }

function showToast(msg){
  toast.innerHTML=msg; toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1100);
}

function submit(){
  if(!started||escaped||timeup) return;
  const val=answerEl.value;
  if(Number(H(val))===Number(phases[ph].hash)){
    feedbackEl.textContent=''; answerEl.value='';
    solvedCount++;
    if(ph===phases.length-1){
      escaped=true; running=false; clearInterval(ref); finishElapsed=TOTAL-remaining;
      showToast('ESCAPED!'); setTimeout(render,700);
    }else{
      ph++; pan=0;
      showToast('Round '+solvedCount+' cleared &middot; +5');
      setTimeout(render,700);
    }
    paintHud();
  }else{
    feedbackEl.textContent='Not quite — try again'; feedbackEl.className='no';
    answerEl.classList.add('shake');
    setTimeout(()=>answerEl.classList.remove('shake'),420);
    setTimeout(()=>{feedbackEl.textContent='';},1500);
  }
}

function resetAll(){
  clearInterval(ref); started=false; escaped=false; timeup=false;
  ph=0; pan=0; solvedCount=0; remaining=TOTAL; running=false; finishElapsed=null;
  answerEl.value=''; feedbackEl.textContent=''; render();
}

prevBtn.onclick=()=>{ if(pan>0){pan--; render();} };
nextBtn.onclick=()=>{ const P=phases[ph]; if(pan<P.panels.length-1){pan++; render();} };
submitBtn.onclick=submit;

answerEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });

document.addEventListener('keydown',e=>{
  const typing=document.activeElement===answerEl;
  if(!started && e.code==='Space'){ e.preventDefault(); begin(); return; }
  if((e.key==='r'||e.key==='R') && !typing){ resetAll(); return; }
  if(!started||escaped||timeup) return;
  if(!typing){
    if(e.key==='ArrowLeft'){ if(pan>0){pan--;render();} }
    else if(e.key==='ArrowRight'){ const P=phases[ph]; if(pan<P.panels.length-1){pan++;render();} }
  }
});

render();
</script>
</body>
</html>
